<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="noise" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="turbulence"/>
    <feColorMatrix type="saturate" values="0" in="turbulence" result="mono"/>
    <feComponentTransfer in="mono" result="grain">
      <feFuncA type="linear" slope="0.35"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#noise)" opacity="0.55"/>
</svg>
